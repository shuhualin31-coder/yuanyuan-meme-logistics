<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="缘缘表情包物流站：表情包素材导入、AI理解与人工审核工具" />
    <title>缘缘表情包物流站</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./">缘缘表情包物流站</a>
      <span>第二阶段 · AI审核工作台</span>
    </header>
    <main class="shell">
      <section class="intro">
        <p class="eyebrow">MEME INTAKE DESK</p>
        <h1>把 memes.zip 放进来，<br />AI负责理解，你负责验收。</h1>
        <p>先送达，再理解。现在物流站已经能读取素材，并通过 AI 分析表情包的聊天语义、情绪与使用场景；人工修改永远优先。</p>
      </section>

      <section class="import-card" aria-labelledby="import-title">
        <div>
          <h2 id="import-title">导入素材</h2>
          <p>ZIP 适合批量整理，也可以直接从手机相册或文件中添加图片。</p>
        </div>
        <div class="import-actions">
          <label class="dropzone" id="dropzone" for="zip-input">
            <input id="zip-input" type="file" accept=".zip,application/zip" />
            <strong>📦 选择 ZIP 文件</strong>
            <span>或将文件拖放到这里</span>
          </label>
          <label class="dropzone" id="direct-dropzone" for="direct-input">
            <input id="direct-input" type="file" accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif" multiple />
            <strong>🖼️ 直接添加图片</strong>
            <span>支持 JPG / PNG 等，可一次多选</span>
          </label>
        </div>
        <p class="file-note" id="file-note">尚未选择文件</p>
        <div class="processing hidden" id="processing" aria-live="polite">
          <div class="progress-line"><i id="progress-bar"></i></div>
          <span id="progress-text">正在准备…</span>
        </div>
      </section>

      <section class="workspace hidden" id="workspace">
        <aside class="sidebar">
          <div class="sidebar-heading">
            <div>
              <p class="eyebrow">素材队列</p>
              <h2 id="image-count">0 张图片</h2>
            </div>
            <button class="text-button" id="retry-failed" type="button">重试失败项</button>
          </div>
          <div class="queue-actions">
            <button class="button primary analyze-all" id="analyze-all" type="button">开始 AI 分析全部</button>
            <button class="button secondary" id="upload-reviewed" type="button">上传已审核到 Supabase</button>
          </div>
          <p class="queue-note">AI只会填入空白资料，不会覆盖你已经手动修改的内容。标记为“已审核”后，才会进入 Supabase 收货口。</p>
          <div class="thumbnails" id="thumbnails" aria-label="图片缩略图"></div>
        </aside>

        <section class="viewer" aria-label="当前图片">
          <div class="viewer-meta">
            <span id="position">0 / 0</span>
            <span class="status" id="current-status">待审核</span>
          </div>
          <div class="image-stage" id="image-stage">
            <p>导入 ZIP 后在这里预览图片</p>
          </div>
          <div class="viewer-actions">
            <button class="button secondary" id="previous" type="button">← 上一张</button>
            <button class="button secondary" id="next" type="button">下一张 →</button>
          </div>
        </section>

        <section class="details">
          <div class="details-heading">
            <div>
              <p class="eyebrow">审核资料</p>
              <h2>表情包信息</h2>
            </div>
            <button class="text-button" id="reanalyze" type="button">重新分析当前</button>
          </div>

          <form id="meme-form">
            <label>name
              <input name="name" placeholder="例如：小猫点头" />
            </label>
            <label>description
              <textarea name="description" rows="3" placeholder="描述画面与动作，方便未来检索"></textarea>
            </label>
            <label>tags
              <input name="tags" placeholder="用逗号分隔，例如：猫, 同意, 可爱" />
            </label>

            <div class="field-grid">
              <label>emotion
                <input name="emotion" placeholder="开心" />
              </label>
              <label>scenes
                <input name="scenes" placeholder="聊天回复, 撒娇" />
              </label>
              <label>tone
                <input name="tone" placeholder="轻松" />
              </label>
              <label>intensity
                <select name="intensity">
                  <option value="">待判断</option>
                  <option value="1">1 · 很轻</option>
                  <option value="2">2 · 较轻</option>
                  <option value="3">3 · 中等</option>
                  <option value="4">4 · 较强</option>
                  <option value="5">5 · 很强</option>
                </select>
              </label>
            </div>

            <label>speech_acts
              <input name="speech_acts" placeholder="例如：亲亲, 求安慰, 表示同意" />
            </label>
            <label>aliases
              <input name="aliases" placeholder="例如：亲亲猫, 猫猫亲亲" />
            </label>

            <label>审核状态
              <select name="status">
                <option value="pending">待审核</option>
                <option value="reviewed">已审核</option>
              </select>
            </label>

            <div class="form-actions">
              <button class="button secondary" id="save" type="submit">保存</button>
              <button class="button primary" id="mark-reviewed" type="button">标记为已审核</button>
            </div>
            <p class="form-note" id="form-note" aria-live="polite"></p>
          </form>
        </section>
      </section>
    </main>

    <template id="thumbnail-template">
      <button class="thumbnail" type="button">
        <img alt="" />
        <span class="thumbnail-status"></span>
        <span class="thumbnail-ai" title="AI已分析"></span>
      </button>
    </template>
    <script src="./app.js?v=20260929-2"></script>
  </body>
</html>
