<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="缘缘表情包物流站：表情包素材导入与审核工具" />
    <title>缘缘表情包物流站</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar"><a class="brand" href="./">缘缘表情包物流站</a><span>第一阶段 · 本地审核工作台</span></header>
    <main class="shell">
      <section class="intro"><p class="eyebrow">MEME INTAKE DESK</p><h1>把 memes.zip 放进来，<br />AI负责理解，你负责验收。</h1><p>先把素材整齐送达。第一阶段在本地解析 ZIP，并为下一阶段的 AI 资料生成与检索预留位置。</p></section>
      <section class="import-card" aria-labelledby="import-title">
        <div><h2 id="import-title">导入素材包</h2><p>支持 ZIP 文件，自动递归寻找 jpg、jpeg、png、webp 和 gif。</p></div>
        <label class="dropzone" id="dropzone" for="zip-input"><input id="zip-input" type="file" accept=".zip,application/zip" /><strong>选择 ZIP 文件</strong><span>或将文件拖放到这里</span></label>
        <p class="file-note" id="file-note">尚未选择文件</p>
        <div class="processing hidden" id="processing" aria-live="polite"><div class="progress-line"><i id="progress-bar"></i></div><span id="progress-text">正在准备…</span></div>
      </section>
      <section class="workspace hidden" id="workspace">
        <aside class="sidebar"><div class="sidebar-heading"><div><p class="eyebrow">素材队列</p><h2 id="image-count">0 张图片</h2></div><button class="text-button" id="retry-failed" type="button">重试失败项</button></div><div class="thumbnails" id="thumbnails" aria-label="图片缩略图"></div></aside>
        <section class="viewer" aria-label="当前图片"><div class="viewer-meta"><span id="position">0 / 0</span><span class="status" id="current-status">待审核</span></div><div class="image-stage" id="image-stage"><p>导入 ZIP 后在这里预览图片</p></div><div class="viewer-actions"><button class="button secondary" id="previous" type="button">← 上一张</button><button class="button secondary" id="next" type="button">下一张 →</button></div></section>
        <section class="details"><div class="details-heading"><div><p class="eyebrow">审核资料</p><h2>表情包信息</h2></div><button class="text-button" id="reanalyze" type="button">重新分析</button></div><form id="meme-form"><label>name<input name="name" placeholder="例如：小猫点头" /></label><label>description<textarea name="description" rows="3" placeholder="描述画面与动作，方便未来检索"></textarea></label><label>tags<input name="tags" placeholder="用逗号分隔，例如：猫, 同意, 可爱" /></label><div class="field-grid"><label>emotion<input name="emotion" placeholder="开心" /></label><label>scenes<input name="scenes" placeholder="聊天回复" /></label><label>tone<input name="tone" placeholder="轻松" /></label><label>intensity<input name="intensity" placeholder="中等" /></label></div><label>审核状态<select name="status"><option value="pending">待审核</option><option value="reviewed">已审核</option></select></label><div class="form-actions"><button class="button secondary" id="save" type="submit">保存</button><button class="button primary" id="mark-reviewed" type="button">标记为已审核</button></div><p class="form-note" id="form-note" aria-live="polite"></p></form></section>
      </section>
    </main>
    <template id="thumbnail-template"><button class="thumbnail" type="button"><img alt="" /><span class="thumbnail-status"></span></button></template>
    <script src="./app.js"></script>
  </body>
</html>
